<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;width:400px;height:400px;overflow:hidden;background:#0b1020}</style>
</head><body>
<!-- WoW CRM project icon, 400 x 400. Rendered to icon-400.png with headless Edge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2b3f7a"/>
      <stop offset="0.55" stop-color="#16214a"/>
      <stop offset="1" stop-color="#090d1f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.35" stop-color="#f2c24a"/>
      <stop offset="0.7" stop-color="#b9821e"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf0d2"/>
      <stop offset="1" stop-color="#e3c98f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- gold ring -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="22"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <circle cx="200" cy="200" r="156" fill="none" stroke="#f2c24a" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#f2c24a" stroke-opacity="0.45" stroke-width="2"/>

  <!-- contacts: linked nodes around the ring -->
  <g filter="url(#glow)">
    <path d="M200 32 A168 168 0 0 1 345.5 116" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-opacity="0.9"/>
    <path d="M345.5 284 A168 168 0 0 1 200 368" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-opacity="0.9"/>
    <path d="M54.5 284 A168 168 0 0 1 54.5 116" fill="none" stroke="#8fd3ff" stroke-width="3" stroke-opacity="0.9"/>
    <g fill="#0b1020" stroke="#8fd3ff" stroke-width="4">
      <circle cx="200" cy="32" r="11"/>
      <circle cx="345.5" cy="116" r="11"/>
      <circle cx="345.5" cy="284" r="11"/>
      <circle cx="200" cy="368" r="11"/>
      <circle cx="54.5" cy="284" r="11"/>
      <circle cx="54.5" cy="116" r="11"/>
    </g>
    <g fill="#d8f1ff">
      <circle cx="200" cy="32" r="4"/><circle cx="345.5" cy="116" r="4"/><circle cx="345.5" cy="284" r="4"/>
      <circle cx="200" cy="368" r="4"/><circle cx="54.5" cy="284" r="4"/><circle cx="54.5" cy="116" r="4"/>
    </g>
  </g>

  <!-- the whisper: a parchment speech bubble -->
  <g filter="url(#shadow)">
    <path d="M110 120 h180 a26 26 0 0 1 26 26 v90 a26 26 0 0 1 -26 26 h-78 l-40 38 l8 -38 h-70 a26 26 0 0 1 -26 -26 v-90 a26 26 0 0 1 26 -26 z"
          fill="url(#parch)" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <text x="200" y="217" text-anchor="middle" font-family="Georgia, 'Book Antiqua', serif" font-weight="bold"
        font-size="76" letter-spacing="3" fill="#3a2410">CRM</text>
  <!-- ledger lines under the word -->
  <g stroke="#8a6a3a" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="140" y1="236" x2="260" y2="236"/>
  </g>

  <!-- name plate -->
  <g filter="url(#shadow)">
    <rect x="128" y="300" width="144" height="34" rx="8" fill="#0b1020" stroke="url(#gold)" stroke-width="3"/>
  </g>
  <text x="200" y="324" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20"
        letter-spacing="4" fill="#f2c24a">WoW CRM</text>
</svg>
</body></html>
